<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PesaLog portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📶%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f4f6f5;--card:#fff;--text:#14201a;--muted:#5b6b62;--line:#dfe6e1;--brand:#0a8f3c;--ink:#fff;--bad:#c62828;--warn:#b26a00;--ok:#1b7f3b}
@media(prefers-color-scheme:dark){:root{--bg:#0e1511;--card:#17211b;--text:#e9f1ec;--muted:#9bb0a3;--line:#26352c;--brand:#2fd36b;--ink:#06210f;--bad:#ff6b6b;--warn:#ffb74d;--ok:#4cd07d}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:820px;margin:0 auto;padding:12px 14px 90px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 10px}
h1{font-size:1.2rem;margin:0}
.btn{border:0;border-radius:10px;padding:10px 14px;font:600 .95rem system-ui,sans-serif;cursor:pointer;background:var(--brand);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.status{font-size:.85rem;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 14px;font:600 .9rem system-ui,sans-serif;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--ink)}
.tool{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:flex-start}
.row input[type=checkbox]{width:22px;height:22px;margin-top:3px;flex:0 0 auto}
.grow{flex:1;min-width:0}
.name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--muted);font-size:.85rem}
.amt{font-weight:800;white-space:nowrap}
.chip{display:inline-block;font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 7px;margin-right:6px;border:1px solid var(--line)}
.chip.failed,.chip.unconfirmed{color:var(--bad);border-color:var(--bad)}
.chip.received,.chip.pending{color:var(--warn);border-color:var(--warn)}
.chip.cmd{color:var(--brand);border-color:var(--brand)}
.chip.cmdbad{color:var(--bad);border-color:var(--bad)}
.reason{font-size:.82rem;margin-top:3px}
input[type=email],input[type=password]{width:100%;padding:12px;margin:6px 0 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:1rem}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.bar .inner{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:center}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
.toast.on{opacity:1}
.err{color:var(--bad);min-height:1.2em;font-size:.9rem}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>📶 PesaLog portal</h1><button class="btn ghost hide" id="logout" type="button">Log out</button></header>

  <div class="card" id="login">
    <b>Log in</b>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
    <div class="err" id="err"></div>
    <button class="btn" id="go" type="button">Log in</button>
  </div>

  <div id="app" class="hide">
    <div class="card" id="phone"></div>
    <div class="tabs" id="tabs" role="group" aria-label="Payments"></div>
    <div class="tool">
      <button class="btn ghost" id="selAll" type="button">Select all</button>
      <button class="btn ghost" id="selNone" type="button">Clear</button>
      <button class="btn ghost" id="refresh" type="button">Refresh</button>
      <span class="status" id="when"></span>
    </div>
    <div id="list"></div>
  </div>
</div>

<div class="bar hide" id="bar"><div class="inner">
  <span class="status" id="count" style="flex:1">0 selected</span>
  <button class="btn" id="retry" type="button" disabled>Retry selected</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================  PUT YOUR TWO VALUES HERE  =====================
   Supabase > Project Settings > API.  Use the Project URL and the "anon public" key.
   NEVER put the "service_role" key here. The anon key is safe to publish: the login and the
   database rules (Row Level Security) are what protect your data. */
const SUPABASE_URL = "https://oatsttwmekgfoxcpjnin.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_5yKJEABZ51uW7Xa8Qn5gKQ_NVZLbuoc";
/* ===================================================================== */

const $ = id => document.getElementById(id);
const TABS = [["failed","Failed"],["unconfirmed","Unconfirmed"],["received","Received"],["pending","Pending"]];
let tab = "failed", rows = [], cmds = {}, selected = new Set(), timer = null, busy = false;

/* ---------- session ---------- */
function getSession(){ try{ return JSON.parse(localStorage.getItem("pl_session")||"null"); }catch(e){ return null; } }
function saveSession(j){
  const s = {access: j.access_token, refresh: j.refresh_token, exp: Date.now() + (j.expires_in||3600)*1000 - 60000};
  localStorage.setItem("pl_session", JSON.stringify(s)); return s;
}
async function auth(path, body){
  const r = await fetch(SUPABASE_URL + "/auth/v1/" + path, {method:"POST", headers:{apikey:SUPABASE_ANON_KEY,"Content-Type":"application/json"}, body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description || j.msg || "Login failed");
  return j;
}
async function token(){
  let s = getSession(); if(!s) throw new Error("login");
  if(Date.now() > s.exp){
    try{ s = saveSession(await auth("token?grant_type=refresh_token", {refresh_token: s.refresh})); }
    catch(e){ localStorage.removeItem("pl_session"); throw new Error("login"); }
  }
  return s.access;
}
async function api(path, opt){
  const t = await token();
  const r = await fetch(SUPABASE_URL + "/rest/v1/" + path, Object.assign({}, opt, {headers:Object.assign({apikey:SUPABASE_ANON_KEY, Authorization:"Bearer "+t, "Content-Type":"application/json"}, (opt&&opt.headers)||{})}));
  if(r.status === 401){ localStorage.removeItem("pl_session"); throw new Error("login"); }
  if(!r.ok){ const j = await r.json().catch(()=>({})); const e = new Error(j.message || ("Error " + r.status)); e.code = j.code; throw e; }
  const txt = await r.text(); return txt ? JSON.parse(txt) : null;
}

/* ---------- helpers ---------- */
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("on"),2600); }
function ago(iso){
  if(!iso) return "never"; const s = Math.max(0, (Date.now()-new Date(iso).getTime())/1000);
  if(s<60) return "just now"; if(s<3600) return Math.floor(s/60)+" min ago"; if(s<86400) return Math.floor(s/3600)+" h ago"; return Math.floor(s/86400)+" d ago";
}
function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
const kes = n => "KES " + Number(n||0).toLocaleString("en-KE", {maximumFractionDigits:2});

/* ---------- data ---------- */
async function load(){
  if(busy) return; busy = true;
  try{
    const since = new Date(Date.now()-6*3600*1000).toISOString();
    const [txn, cm, dev] = await Promise.all([
      api("txn_sync?select=ref,name,phone_masked,amount,plan,status,reason,paid_at&status=in.(failed,unconfirmed,received,pending)&order=paid_at.desc&limit=400"),
      api("commands?select=ref,status,result,updated_at&created_at=gte."+since+"&order=created_at.desc&limit=400"),
      api("device_state?select=*&limit=1")
    ]);
    rows = txn||[]; cmds = {};
    (cm||[]).forEach(c => { if(!cmds[c.ref]) cmds[c.ref] = c; });
    selected.forEach(r => { if(!rows.some(x => x.ref===r)) selected.delete(r); });
    drawPhone(dev && dev[0]); draw();
    $("when").textContent = "Updated " + new Date().toLocaleTimeString();
  }catch(e){
    if(e.message==="login"){ showLogin(); } else { toast(e.message); }
  }finally{ busy = false; }
}

function drawPhone(d){
  const c = $("phone"); c.textContent = "";
  if(!d){ c.appendChild(el("div","status","The phone has not reported yet. Turn on the portal sync in PesaLog.")); return; }
  const fresh = d.last_seen && (Date.now()-new Date(d.last_seen).getTime()) < 5*60*1000;
  const t = el("div",null,(fresh ? "🟢 Phone online" : "🔴 Phone offline") + " · seen " + ago(d.last_seen));
  t.style.fontWeight = "700"; c.appendChild(t);
  const bits = [];
  if(d.app_version) bits.push("PesaLog " + d.app_version);
  if(d.airtime!=null) bits.push("Airtime " + kes(d.airtime));
  if(d.automation===false) bits.push("⚠ Automation is OFF");
  c.appendChild(el("div","status",bits.join(" · ")));
  if(!fresh) c.appendChild(el("div","status","Retries wait until the phone is back online and PesaLog is running."));
}

function draw(){
  const tabs = $("tabs"); tabs.textContent = "";
  TABS.forEach(([k,label]) => {
    const n = rows.filter(r => r.status===k).length;
    const b = el("button","tab",label + " " + n); b.type="button"; b.setAttribute("aria-pressed", String(tab===k));
    b.onclick = () => { tab = k; selected.clear(); draw(); };
    tabs.appendChild(b);
  });
  const list = $("list"); list.textContent = "";
  const vis = rows.filter(r => r.status===tab);
  if(!vis.length){ const c = el("div","card"); c.appendChild(el("div","status","Nothing here. 🎉")); list.appendChild(c); }
  vis.forEach(r => {
    const card = el("div","card"), row = el("div","row");
    const cb = document.createElement("input"); cb.type="checkbox"; cb.checked = selected.has(r.ref);
    const cm = cmds[r.ref], active = cm && (cm.status==="queued"||cm.status==="running");
    cb.disabled = !!active;
    cb.onchange = () => { cb.checked ? selected.add(r.ref) : selected.delete(r.ref); count(); };
    const mid = el("div","grow");
    mid.appendChild(el("div","name", r.name || "Unknown"));
    mid.appendChild(el("div","sub", (r.phone_masked||"number hidden") + " · " + ago(r.paid_at) + (r.plan ? " · " + r.plan : "")));
    const chips = el("div","reason"); chips.appendChild(el("span","chip "+r.status, r.status));
    if(cm){
      const bad = cm.status==="failed";
      chips.appendChild(el("span","chip "+(bad?"cmdbad":"cmd"), cm.status==="queued"?"waiting for phone":cm.status==="running"?"running":cm.status==="done"?"retried":"retry failed"));
    }
    mid.appendChild(chips);
    if(r.reason) mid.appendChild(el("div","reason status", r.reason));
    if(cm && cm.result && !active) mid.appendChild(el("div","reason status", "Phone: " + cm.result));
    row.append(cb, mid, el("div","amt", kes(r.amount)));
    card.appendChild(row); list.appendChild(card);
  });
  count();
}
function count(){
  const n = selected.size; $("count").textContent = n + " selected"; $("retry").disabled = n===0;
}

/* ---------- actions ---------- */
$("selAll").onclick = () => {
  rows.filter(r => r.status===tab).forEach(r => { const c = cmds[r.ref]; if(!(c && (c.status==="queued"||c.status==="running"))) selected.add(r.ref); });
  draw();
};
$("selNone").onclick = () => { selected.clear(); draw(); };
$("refresh").onclick = () => load();
$("retry").onclick = async () => {
  const refs = [...selected]; if(!refs.length) return;
  const risky = refs.filter(r => { const x = rows.find(y => y.ref===r); return x && x.status!=="failed" && x.status!=="received"; }).length;
  const msg = "Send " + refs.length + " retr" + (refs.length===1?"y":"ies") + " to the phone?\n\nThe phone first checks its messages for Safaricom's confirmation and skips anything already delivered." +
    (risky ? "\n\n" + risky + " of them are Unconfirmed or Pending: the USSD may already have run. The message check protects you, but a delivery whose confirmation never arrived could be sent twice." : "");
  if(!confirm(msg)) return;
  $("retry").disabled = true;
  try{
    await api("commands", {method:"POST", headers:{Prefer:"return=minimal"}, body:JSON.stringify(refs.map(ref => ({ref, action:"retry"})))});
    toast("Sent to the phone. It picks them up within a minute.");
    selected.clear(); await load();
  }catch(e){
    if(e.code==="23505") toast("Some of these are already waiting for the phone."); else toast(e.message);
    $("retry").disabled = false;
  }
};

/* ---------- login ---------- */
function showApp(){ $("login").classList.add("hide"); $("app").classList.remove("hide"); $("bar").classList.remove("hide"); $("logout").classList.remove("hide");
  load(); clearInterval(timer); timer = setInterval(() => { if(!document.hidden) load(); }, 15000); }
function showLogin(){ clearInterval(timer); $("app").classList.add("hide"); $("bar").classList.add("hide"); $("logout").classList.add("hide"); $("login").classList.remove("hide"); }
$("go").onclick = async () => {
  $("err").textContent = ""; $("go").disabled = true;
  try{
    saveSession(await auth("token?grant_type=password", {email:$("email").value.trim(), password:$("pass").value}));
    $("pass").value = ""; showApp();
  }catch(e){ $("err").textContent = e.message; }
  $("go").disabled = false;
};
$("pass").addEventListener("keydown", e => { if(e.key==="Enter") $("go").click(); });
$("logout").onclick = () => { localStorage.removeItem("pl_session"); selected.clear(); showLogin(); };
document.addEventListener("visibilitychange", () => { if(!document.hidden && getSession()) load(); });
if(getSession()) showApp(); else showLogin();
</script>
</body>
</html>
